[package]
name = "stellar-payment-escrow"
version = "0.1.0"
edition = "2021"
publish = false
description = "Soroban escrow contract for programmable Stellar token payments"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
